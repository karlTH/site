<!DOCTYPE html>
 <html>
    <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoAR.js demo</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
	
	
	<script src="Babylon.js"></script>
<script src="babylon.stlFileLoader.js"></script>
  <script type="text/javascript">
    AFRAME.registerComponent('drag-rotate-move-component', {
      schema: {
        speed: { default: 4 },
        zoomSpeed: { default: 0.5 },
        moveSpeed: { default: 0.01 } // Ajout de la vitesse de déplacement
      },
      init: function () {
        this.ifMouseDown = false;
        this.ifMiddleMouseDown = false; // Nouvelle variable pour le clic du milieu
        this.x_cord = 0;
        this.y_cord = 0;
        this.targetPosition = new THREE.Vector3(); // Nouvelle variable pour la position de l'élément
        document.addEventListener('mousedown', this.OnDocumentMouseDown.bind(this));
        document.addEventListener('mouseup', this.OnDocumentMouseUp.bind(this));
        document.addEventListener('mousemove', this.OnDocumentMouseMove.bind(this));
        document.addEventListener('wheel', this.OnDocumentMouseWheel.bind(this));
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); }); // Désactive le menu contextuel
      },
      OnDocumentMouseDown: function (event) {
        if (event.button === 0) {
          this.ifMouseDown = true;
          this.x_cord = event.clientX;
          this.y_cord = event.clientY;
        } else if (event.button === 1) {
          this.ifMiddleMouseDown = true;
        }
      },
      OnDocumentMouseUp: function (event) {
        if (event.button === 0) {
          this.ifMouseDown = false;
        } else if (event.button === 1) {
          this.ifMiddleMouseDown = false;
        }
      },
      OnDocumentMouseMove: function (event) {
        if (this.ifMouseDown) {
          var temp_x = event.clientX - this.x_cord;
          var temp_y = event.clientY - this.y_cord;
          if (Math.abs(temp_y) < Math.abs(temp_x)) {
            this.el.object3D.rotateY(temp_x * this.data.speed / 1000);
          } else {
            this.el.object3D.rotateX(temp_y * this.data.speed / 1000);
          }
          this.x_cord = event.clientX;
          this.y_cord = event.clientY;
        } else if (this.ifMiddleMouseDown) {
          // Déplacement lorsque le clic du milieu est enfoncé
          var deltaX = event.clientX - this.x_cord;
          var deltaY = event.clientY - this.y_cord;
          this.x_cord = event.clientX;
          this.y_cord = event.clientY;

          // Convertit le mouvement de la souris en déplacement dans la scène
          var distance = this.el.object3D.position.distanceTo(this.targetPosition);
          var factor = distance / 500; // Ajustez ce facteur selon vos besoins
          var moveX = deltaX * factor;
          var moveY = deltaY * factor;

          // Met à jour la position cible
        this.el.object3D.position.x += moveX;
        this.el.object3D.position.y -= moveY; // Inversé pour correspondre à la direction du mouvement de la souris
        }
      },
      OnDocumentMouseWheel: function (event) {
        var delta = event.deltaY;
        var scale = 1 + delta * this.data.zoomSpeed / 1000;
        this.el.object3D.scale.multiplyScalar(scale);
      }
    });
  </script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
 

<a-entity obj-model="obj: url(https://d2z6pp1b5cghw2.cloudfront.net/3f805b32-c95d-4109-b10f-308be54f718f/model.obj); mtl: url(https://d2z6pp1b5cghw2.cloudfront.net/3f805b32-c95d-4109-b10f-308be54f718f/model.mtl);" scale="0.5 0.5 0.5" rotation="0 90 0" position="0d 1.5 -2" drag-rotate-move-component ></a-entity>


  



      <a-camera   look-controls="enabled:false"></a-camera>
	<a-cursor></a-cursor>
    </a-scene>
  </body>
</html>
